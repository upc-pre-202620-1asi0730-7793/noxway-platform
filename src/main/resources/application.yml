spring:
  application:
    name: noxway-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/noxway}
    username: ${DB_USERNAME:noxway}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
noxway:
  cors-origins: ${CORS_ORIGINS:http://localhost:4200}
  session-hours: ${SESSION_HOURS:8}
  bootstrap-admin-email: ${ADMIN_EMAIL:}
  bootstrap-admin-password: ${ADMIN_PASSWORD:}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
