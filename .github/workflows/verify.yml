name: Verify backend
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: noxway_test
          POSTGRES_USER: noxway_test
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U noxway_test -d noxway_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - name: Test local profile and domain rules
        run: ./mvnw -B verify
      - name: Test PostgreSQL migrations and API
        run: ./mvnw -B verify
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/noxway_test
          TEST_DB_DRIVER: org.postgresql.Driver
          TEST_DB_USERNAME: noxway_test
          TEST_DB_PASSWORD: ci-only-password
