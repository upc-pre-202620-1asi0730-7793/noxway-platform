services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: noxway
      POSTGRES_USER: noxway
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noxway -d noxway"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://database:5432/noxway
      DB_USERNAME: noxway
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
      NOXWAY_DELIVERY_WEBHOOK_URL: ${NOXWAY_DELIVERY_WEBHOOK_URL:-}
      NOXWAY_DELIVERY_WEBHOOK_SECRET: ${NOXWAY_DELIVERY_WEBHOOK_SECRET:-}
volumes:
  postgres-data:
